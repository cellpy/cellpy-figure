# One required check. Do not add a second workflow that reports this name:
# a pull request that touches code and docs would then show two results, and
# the branch protection check becomes ambiguous.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (linux / uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Test
        env:
          MPLBACKEND: Agg
        run: uv run pytest
